name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Abhängigkeiten installieren
        run: python -m pip install -r requirements.txt
      - name: Tests (ohne Netz)
        run: python -m pytest -q
      - name: Komplette Läufe
        run: |
          python run.py --out /tmp/results
          python run_extended.py --out /tmp/results
